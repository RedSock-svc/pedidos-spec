# Inventario del producto: componentes, contratos que expone o consume cada uno y dependencias externas.
# Ver docs/conceptos-producto-y-componentes.md#productoyaml de la factory.

producto: pedidos
modo: pequeño            # individual, pequeño o completo

componentes:
  - nombre: backend
    repo: pedidos-backend
    plantilla: java-spring-modulith
    contratos:
      expone: [pedidos-api.v1]
      consume: []
  - nombre: web
    repo: pedidos-web
    plantilla: web-react
    contratos:
      consume: [pedidos-api.v1]

externos: []

publicos: []
